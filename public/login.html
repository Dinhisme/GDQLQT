<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a1128" />
    <title>ORION — Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    <div class="bg-gradient"></div>
    <div class="orb-layer" id="orb-layer-1">
        <div class="orb orb-1"></div>
    </div>
    <div class="orb-layer" id="orb-layer-2">
        <div class="orb orb-2"></div>
    </div>
    <div class="orb-layer" id="orb-layer-3">
        <div class="orb orb-3"></div>
    </div>
    <div class="stars" id="stars"></div>
    <div class="grain"></div>

    <main class="stage">
        <div class="card">
            <div class="emblem">
                <div class="emblem-ring"></div>
                <div class="emblem-core">
                    <div class="logo-form">
                        <img src="images/logo.png" alt="Target Logo" class="header-logo">
                    </div>
                </div>
            </div>

            <div class="brand reveal">HỆ THỐNG QUẢN LÝ QUY TRÌNH</div>
            <div class="eyebrow reveal">Cổng đăng nhập</div>
            <h1 class="reveal" style="margin-bottom: 20px;">Chào mừng trở lại</h1>


            <form id="login-form" novalidate>
                <div class="field reveal">
                    <input type="username" id="username" name="username" placeholder=" " autocomplete="username"
                        spellcheck="false" autocapitalize="off" />
                    <label for="username">Tên đăng nhập</label>
                    <span class="field-error" id="username-error"></span>
                </div>

                <div class="field reveal">
                    <input type="password" id="password" name="password" placeholder=" "
                        autocomplete="current-password" />
                    <label for="password">Mật khẩu</label>
                    <button type="button" class="toggle-password" aria-label="Hiện mật khẩu">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-2.16 3.19" />
                            <path d="M6.6 6.6C3.87 8.36 2 12 2 12s3.5 7 10 7a9.5 9.5 0 0 0 5.4-1.6" />
                            <path d="M10.58 10.58a2 2 0 1 0 2.83 2.83" />
                            <path d="M2 2l20 20" />
                        </svg>
                    </button>
                    <span class="field-error" id="password-error"></span>
                </div>

                <button type="submit" class="btn-primary reveal-fade" id="submit-btn">
                    <span class="btn-label">Đăng nhập</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M13 6l6 6-6 6" />
                    </svg>
                    <svg class="btn-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12l5 5L20 6" />
                    </svg>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>
                <p class="subtitle reveal" style="text-align: center; padding-top: 20px;">@2026 Phùng Quốc Vinh</p>
            </form>

        </div>
    </main>

    <script src="js/login.js"></script>
    <script src="api/login_api.js"></script>
</body>

</html>
